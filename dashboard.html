<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - AI Legal Empowerment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pink-bg">

<div class="container">

    <h1>AI Legal Empowerment System 👩‍⚖</h1>

    <div class="quote-box">
        <p id="quote">"You are stronger than you think."</p>
    </div>

    <textarea id="userInput" placeholder="Describe your situation here..."></textarea>

    <button onclick="analyzeText()">Get Legal Guidance</button>

    <div class="result" id="resultBox">
        <h3>AI Prediction</h3>
        <p id="category"></p>
        <p id="advice"></p>
    </div>

    <div class="emergency">
        <h3>🚨 Emergency Helpline</h3>
        <p>Women Helpline: 181</p>
        <p>Police: 100</p>
        <p>Cyber Crime: 1930</p>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
